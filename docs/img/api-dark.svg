<svg xmlns="http://www.w3.org/2000/svg" width="760" height="228" viewBox="0 0 760 228" role="img" aria-label="PHP: an API-style request"><rect x="0.5" y="0.5" width="759" height="227" rx="10" fill="#161B22" stroke="#30363D"/><text x="24" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#E6EDF3">PHP: an API-style request</text><text x="24" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8B949E">wait 20 ms on a backend, then real work. 4 workers, 32 connections. Higher is better.</text><text x="24" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E6EDF3">BlitzVM</text><rect x="214" y="85" width="412" height="12" rx="4" fill="#21262D"/><rect x="214" y="85" width="412.0" height="12" rx="4" fill="#FFBE3B"/><text x="736" y="96" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFBE3B">293 req/s</text><text x="24" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#E6EDF3">Swoole</text><text x="24" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8B949E">default</text><rect x="214" y="113" width="412" height="12" rx="4" fill="#21262D"/><rect x="214" y="113" width="271.4" height="12" rx="4" fill="#3D4654"/><text x="736" y="124" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#E6EDF3">193 req/s</text><text x="24" y="157" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#E6EDF3">php-fpm</text><text x="24" y="171" font-family="-apple-system, BlinkMacSystemFont, 'S