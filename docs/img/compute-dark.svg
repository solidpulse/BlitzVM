<svg xmlns="http://www.w3.org/2000/svg" width="760" height="488" viewBox="0 0 760 488" role="img" aria-label="PHP: compute vs PHP's own JIT"><rect x="0.5" y="0.5" width="759" height="487" rx="10" fill="#161B22" stroke="#30363D"/><text x="24" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#E6EDF3">PHP: compute vs PHP's own JIT</text><text x="24" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8B949E">ms per run, warm. php-fpm has the tracing JIT on; Swoole can't use it. Lower is better.</text><text x="24" y="91" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8B949E">tak(24, 16, 8), lots of recursion</text><text x="24" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E6EDF3">BlitzVM</text><rect x="214" y="107" width="412" height="12" rx="4" fill="#21262D"/><rect x="214" y="107" width="91.6" height="12" rx="4" fill="#FFBE3B"/><text x="736" y="118" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFBE3B">8.2 ms</text><text x="24" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#E6EDF3">php-fpm</text><text x="24" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8B949E">tracing JIT</text><rect x="214" y="135" width="412" height="12" rx="4" fill="#21262D"/><rect x="214" y="135" width="163.0" height="12" rx="4" fill="#3D4654"/><text x="736" y="146" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#E6EDF3">15 ms</text><text x="24" y="179" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#E6EDF3">Swoole</text><rect x="214" y="169" width="412" height="12" rx="4" fill="#21262D"/><rect x="214" y="169" width="412.0" height="12" rx="4" fill="#3D4654"/><text x="736" y="180" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#E6EDF3">37 ms</text><text x="24" y="213" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8B949E">collatz to 300,000, integer branches</text><text x="24" y="239" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E6EDF3">BlitzVM</text><rect x="214" y="229" width="412" height="12" rx="4" fill="#21262D"/><rect x="214" y="229" width="117.5" height="12" rx="4" fill="#FFBE3B"/><text x="736" y="240" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFBE3B">144 ms</text><text x="24" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#E6EDF3">php-fpm</text><text x="24" y="281" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8B949E">tracing JIT</text><rect x="214" y="257" width="412" height="12" rx="4" fill="#21262D"/><rect x="214" y="257" width="193.9" height="12" rx="4" fill="#3D4654"/><text x="736" y="268" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#E6EDF3">238 ms</text><text x="24" y="301" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#E6EDF3">Swoole</text><rect x="214" y="291" width="412" height="12" rx="4" fill="#21262D"/><rect x="214" y="291" width="412.0" height="12" rx="4" fill="#3D4654"/><text x="736" y="302" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#E6EDF3">505 ms</text><text x="24" y="335" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8B949E">pixel loop built from tiny helper functions</text><text x="24" y="361" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E6EDF3">BlitzVM</text><rect x="214" y="351" width="412" height="12" rx="4" fill="#21262D"/><rect x="214" y="351" width="121.5" height="12" rx="4" fill="#FFBE3B"/><text x="736" y="362" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFBE3B">20 ms</text><text x="24" y="389" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#E6EDF3">php-fpm</text><text x="24" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8B949E">tracing JIT</text><rect x="214" y="379" width="412" height="12" rx="4" fill="#21262D"/><rect x="214" y="379" width="161.8" height="12" rx="4" fill="#3D4654"/><text x="736" y="390" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#E6EDF3">27 ms</text><text x="24" y="423" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#E6EDF3">Swoole</text><rect x="214" y="413" width="412" height="12" rx="4" fill="#21262D"/><rect x="214" y="413" width="412.0" height="12" rx="4" fill="#3D4654"/><text x="736" y="424" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#E6EDF3">70 ms</text><line x1="24" y1="446" 