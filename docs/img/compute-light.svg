<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-label="PHP-BlitzVM: how much faster than PHP's own JIT"><rect x="0.5" y="0.5" width="759" height="349" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><text x="24" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1F2328">PHP-BlitzVM: how much faster than PHP's own JIT</text><text x="24" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#59636E">times faster than php-fpm with the tracing JIT, warm, one worker. Higher is better.</text><text x="24" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328">collatz to 300,000</text><text x="24" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636E">91 ms vs 228 ms on the JIT, Swoole 478 ms</text><rect x="234" y="85" width="392" height="12" rx="4" fill="#E6EAEF"/><rect x="234" y="85" width="327.4" height="12" rx="4" fill="#D98E04"/><text x="736" y="96" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#9A6200">2.5x</text><text x="24" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328">pixel loop, small helpers</text><text x="24" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636E">11 ms vs 26 ms on the JIT, Swoole 65 ms</text><rect x="234" y="119" width="392" height="12" rx="4" fill="#E6EAEF"/><rect x="234" y="119" width="309.7" height="12" rx="4" fill="#D98E04"/><text x="736" y="130" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#9A6200">2.4x</text><text x="24" y="163" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328">mandelbrot 600 x 600</text><text x="24" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636E">27 ms vs 46 ms on the JIT, Swoole 230 ms</text><rect x="234" y="153" width="392" height="12" rx="4" fill="#E6EAEF"/><rect x="234" y="153" width="221.5" height="12" rx="4" fill="#D98E04"/><text x="736" y="164" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#9A6200">1.7x</text><text x="24" y="197" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328">tak(24, 16, 8)</text><text x="24" y="211" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636E">8.6 ms vs 14 ms on the JIT, Swoole 35 ms</text><rect x="234" y="187" width="392" height="12" rx="4" fill="#E6EAEF"/><rect x="234" y="187" width="218.8" height="12" rx="4" fill="#D98E04"/><text x="736" y="198" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#9A6200">1.7x</text><text x="24" y="231" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328">gcd sum, n = 600</text><text x="24" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636E">9.1 ms vs 11 ms on the JIT, Swoole 27 ms</text><rect x="234" y="221" width="392" height="12" rx="4" fill="#E6EAEF"/><rect x="234" y="221" width="153.6" height="12" rx="4" fill="#D98E04"/><text x="736" y="232" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#9A6200">1.2x</text><text x="24" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328">spectral-norm, n = 300</text><text x="24" y="279" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636E">41 ms vs 49 ms on the JIT, Swoole 111 ms</text><rect x="234" y="255" width="392" height="12" rx="4" fill="#E6EAEF"/><rect x="234" y="255" width="154.0" height="12" rx="4" fill="#D98E04"/><text x="736" y="266" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#9A6200">1.2x</text><line x1="364.7" y1="80" x2="364.7" y2="278" stroke="#1F2328" stroke-width="1" stroke-dasharray="3 3"/><text x="369.7" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#59636E">1x = PHP's JIT</text><line x1="24" y1="308" x2="736" y2="308" stroke="#D0D7DE"/><text x="24" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#9A6200">1.2x to 2.5x faster than PHP's JIT; 2.7x to 8.4x faster than Swoole</text></svg>
