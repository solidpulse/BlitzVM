<svg xmlns="http://www.w3.org/2000/svg" width="760" height="324" viewBox="0 0 760 324" role="img" aria-label="A quick request while a slow one runs"><rect x="0.5" y="0.5" width="759" height="323" rx="10" fill="#161B22" stroke="#30363D"/><text x="24" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#E6EDF3">A quick request while a slow one runs</text><text x="24" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8B949E">ms until a hello request is answered while a 4 s CPU loop holds the only worker. Lower is better.</text><text x="24" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E6EDF3">PHP on BlitzVM</text><rect x="214" y="85" width="412" height="12" rx="4" fill="#21262D"/><rect x="214" y="85" width="4.0" height="12" rx="4" fill="#FFBE3B"/><text x="736" y="96" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFBE3B">5.0 ms</text><text x="24" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E6EDF3">JavaScript on BlitzVM</text><rect x="214" y="113" width="412" height="12" rx="4" fill="#21262D"/><rect x="214" y="113" width="4.0" height="12" rx="4" fill="#FFBE3B"/><text x="736" y="124" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFBE3B">25 ms</text><text x="24" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#E6EDF3">Bun</text><text x="24" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8B949E">1.4.4</text><rect x="214" y="141" width="4