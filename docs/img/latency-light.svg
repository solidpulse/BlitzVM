ight="12" rx="4" fill="#AEB6C2"/><text x="736" y="254" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1F2328">3,780 ms</text><line x1="24" y1="282" x2="736" y2="282" stroke="#D0D7DE"/><text x="24" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#9A6200">BlitzVM: 5 to 25 ms. The rest: over 3.4 s</text></svg>
