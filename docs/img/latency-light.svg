<svg xmlns="http://www.w3.org/2000/svg" width="760" height="324" viewBox="0 0 760 324" role="img" aria-label="A quick request while a slow one runs"><rect x="0.5" y="0.5" width="759" height="323" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><text x="24" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1F2328">A quick request while a slow one runs</text><text x="24" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#59636E">ms until a hello request is answered while a 4 s CPU loop holds the only worker. Lower is better.</text><text x="24" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328">PHP on BlitzVM</text><rect x="234" y="85" width="392" height="12" rx="4" fill="#E6EAEF"/><rect x="234" y="85" width="4.0" height="12" rx="4" fill="#D98E04"/><text x="736" y="96" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#9A6200">5.0 ms</text><text x="24" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328">JavaScript on BlitzVM</text><rect x="234" y="113" width="392" height="12" rx="4" fill="#E6EAEF"/><rect x="234" y="113" width="4.0" height="12" rx="4" fill="#D98E04"/><text x="736" y="124" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#9A6200">25 ms</text><text x="24" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1F2328">Bun</text><text x="24" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636E">1.4.4</text><rect x="234" y="141" width="3