<svg xmlns="http://www.w3.org/2000/svg" width="760" height="234" viewBox="0 0 760 234" role="img" aria-label="PHP: an API-style request"><rect x="0.5" y="0.5" width="759" height="233" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><text x="24" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1F2328">PHP: an API-style request</text><text x="24" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#59636E">wait 20 ms on a backend, then real work. 4 workers, 32 connections. Higher is better.</text><text x="24" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328">BlitzVM</text><text x="24" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636E">p99 73 ms</text><rect x="234" y="85" width="392" height="12" rx="4" fill="#E6EAEF"/><rect x="234" y="85" width="392.0" height="12" rx="4" fill="#D98E04"/><text x="736" y="96" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#9A6200">523 req/s</text><text x="24" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1F2328">Swoole</text><text x="24" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636E">default, p99 237 ms</text><rect x="234" y="119" width="392" height="12" rx="4" fill="#E6EAEF"/><rect x="234" y="119" width="279.6" height="12" rx="4" fill="#AEB6C2"/><text x="736" y="130" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1F2328">373 req/s</text><text x="24" y="163" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1F2328">php-fpm</text><text x="24" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636E">nginx + tracing JIT, p99 274 ms</text><rect x="234" y="153" width="392" height="12" rx="4" fill="#E6EAEF"/><rect x="234" y="153" width="98.2" height="12" rx="4" fill="#AEB6C2"/><text x="736" y="164" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1F2328">131 req/s</text><line x1="24" y1="192" x2="736" y2="192" stroke="#D0D7DE"/><text x="24" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#9A6200">4x php-fpm, 1.4x Swoole, a third of Swoole's p99</text></svg>
