<svg xmlns="http://www.w3.org/2000/svg" width="760" height="378" viewBox="0 0 760 378" role="img" aria-label="BlitzVM-JS vs Node.js and Bun: time to run a CPU-heavy loop"><rect x="0.5" y="0.5" width="759" height="377" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><text x="24" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1F2328">BlitzVM-JS vs Node.js and Bun: time to run a CPU-heavy loop</text><text x="24" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#59636E">ms for one run of a number-crunching function, no I/O, warm. Lower is better.</text><text x="24" y="91" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#59636E">collatz to 300,000</text><text x="24" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328">BlitzVM-JS</text><rect x="234" y="107" width="392" height="12" rx="4" fill="#E6EAEF"/><rect x="234" y="107" width="164.7" height="12" rx="4" fill="#D98E04"/><text x="736" y="118" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#9A6200">179 ms</text><text x="24" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1F2328">Node.js</text><text x="24" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636E">22.14, V8</text><rect x="234" y="135" width="392" height="12" rx="4" fill="#E6EAEF"/><rect x="234" y="135" width="290.2" height="12" rx="4" fill="#AEB6C2"/><text x="736" y="146" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1F2328">316 ms</text><text x="24" y="179" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1F2328">Bun</text><text x="24" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636E">1.4.4, JavaScriptCore</text><rect x="234" y="169" width="392" height="12" rx="4" fill="#E6EAEF"/><rect x="234" y="169" width="392.0" height="12" rx="4" fill="#AEB6C2"/><text x="736" y="180" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1F2328">427 ms</text><text x="24" y="219" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#59636E">primes to 2,000,000</text><text x="24" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328">BlitzVM-JS</text><rect x="234" y="235" width="392" height="12" rx="4" fill="#E6EAEF"/><rect x="234" y="235" width="336.3" height="12" rx="4" fill="#D98E04"/><text x="736" y="246" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#9A6200">128 ms</text><text x="24" y="273" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1F2328">Bun</text><text x="24" y="287" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636E">1.4.4, JavaScriptCore</text><rect x="234" y="263" width="392" height="12" rx="4" fill="#E6EAEF"/><rect x="234" y="263" width="351.3" height="12" rx="4" fill="#AEB6C2"/><text x="736" y="274" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1F2328">134 ms</text><text x="24" y="307" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1F2328">Node.js</text><text x="24" y="321" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636E">22.14, V8</text><rect x="234" y="297" width="392" height="12" rx="4" fill="#E6EAEF"/><rect x="234" y="297" width="392.0" height="12" rx="4" fill="#AEB6C2"/><text x="736" y="308" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1F2328">149 ms</text><line x1="24" y1="336" x2="736" y2="336" stroke="#D0D7DE"/><text x="24" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#9A6200">1.8x Node.js on collatz; ahead of both on primes</text></svg>
